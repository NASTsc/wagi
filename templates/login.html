<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login // SCALE MANAGER</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center h-screen">
    <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 w-full max-w-sm shadow-2xl">
        <h2 class="text-2xl font-bold text-sky-400 text-center mb-1">SCALE MANAGER</h2>
        <p class="text-[10px] text-center text-slate-500 font-mono mb-6">CLOUD SECURE REGISTRY // 2026</p>
        <form method="POST" class="space-y-4">
            <input type="text" name="u" placeholder="Login" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500">
            <input type="password" name="p" placeholder="Hasło" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500">
            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold p-3 rounded-xl transition duration-200 mt-2">ZALOGUJ SIĘ</button>
        </form>
    </div>
</body>
</html>
